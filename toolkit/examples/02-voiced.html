<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>02 – voiced</title>
<!-- Voiced example: every time comes from the voice (shared/voice.js, generated by `pnpm example` / voice-meta).
     A project scene would also link ../shared/product.css instead of the inline <style>. -->
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../base.css">
<style>
  #page { font: 15px/1.5 "Inter", sans-serif; color: #1f2328; background: #f5f6f8; }
  .bar { height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 32px; background: #fff; border-bottom: 1px solid #d9dde3; font-weight: 600; font-size: 17px; }
  .logo { width: 28px; height: 28px; border-radius: 6px; background: #3355cc; }
  main { padding: 40px 64px; }
  .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  h1 { margin: 0; font-size: 26px; font-weight: 600; }
  .btn { font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 6px; border: 1px solid #3355cc; background: #3355cc; color: #fff; }
  .btn.hov { background: #2a47ad; }
  table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #d9dde3; }
  th, td { text-align: left; padding: 14px 20px; border-bottom: 1px solid #e6e8ec; }
  th { font-size: 13px; color: #6b7280; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .pill { padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 500; background: #fdf3e1; color: #b7791f; }
  .pill.ok { background: #e7f5ec; color: #2f855a; }
  .backdrop { position: absolute; inset: 0; background: #000; display: none; }
  .modal { position: absolute; left: 50%; top: 150px; width: 520px; display: none; background: #fff; border-radius: 8px;
           box-shadow: 0 10px 30px rgba(0, 0, 0, .18); font: 15px/1.5 "Inter", sans-serif; color: #1f2328; }
  .modal header { padding: 20px 24px; font-size: 18px; font-weight: 600; border-bottom: 1px solid #e6e8ec; }
  .modal .line { display: flex; justify-content: space-between; padding: 10px 24px; }
  .modal .line.total { font-weight: 700; font-size: 17px; border-top: 1px solid #e6e8ec; padding: 14px 24px; }
  .modal footer { display: flex; justify-content: flex-end; padding: 16px 24px; border-top: 1px solid #e6e8ec; }
  :root { --caption-font: "Inter", sans-serif; }   /* captions sit outside #page; a project sets this in product.css */
</style>
</head>
<body>
<div id="stage"><div id="camera">
  <div id="page">
    <div class="bar"><span class="logo"></span>Example app</div>
    <main>
      <div class="head"><h1>Orders</h1><button class="btn" id="open-panel">Order details</button></div>
      <table>
        <tr><th>Order</th><th>Customer</th><th>Status</th><th class="num">Total</th></tr>
        <tr id="row"><td>#1042</td><td>Ada Berg</td><td><span class="pill" id="status">Pending</span></td><td class="num">1 240.00</td></tr>
        <tr><td>#1041</td><td>Jon Lie</td><td><span class="pill ok">Approved</span></td><td class="num">860.00</td></tr>
        <tr><td>#1040</td><td>Kari Dahl</td><td><span class="pill ok">Approved</span></td><td class="num">2 115.50</td></tr>
      </table>
    </main>
  </div>
  <div class="backdrop" id="backdrop"></div>
  <div class="modal" id="dialog">
    <header>Order #1042</header>
    <div class="line"><span>Desk lamp × 2</span><span>480.00</span></div>
    <div class="line"><span>Office chair</span><span>760.00</span></div>
    <div class="line total" id="total"><span>Total</span><span>1 240.00</span></div>
    <footer><button class="btn" id="approve">Approve and close</button></footer>
  </div>
</div></div>
<script src="./shared/voice.js"></script>
<script src="../engine.js"></script>
<script>
  const S = sceneInfo(2);                          // duration, lead, audioSrc, cue … from shared/voice.js
  const T = { open: S.cue("open the panel"), total: S.cue("highlight the total"), close: S.cue("modal closes") };

  createDemo({
    duration: S.duration, lead: S.lead, audioSrc: S.audioSrc, audioDuration: S.audioDuration, cue: S.cue,
    camera: [
      { t: 0, ...CAM_BASE },
      { t: T.open + .2, ...CAM_BASE },
      { t: T.open + .9, s: 1.4, sel: "#dialog", dy: 60, at: T.open + .5 },   // measured while the dialog is open
      { t: T.close + .2, s: 1.4, sel: "#dialog", dy: 60, at: T.open + .5 },
      { t: T.close + .9, ...CAM_BASE },
    ],
    moves: [
      { t0: T.open - 1.1, t1: T.open - .2, to: { sel: "#open-panel" } },
      { t0: T.open + .3, t1: T.open + 1.0, to: { sel: "#dialog", ax: .3, ay: .92 } },   // off the button before the zoom
      { t0: T.close - .7, t1: T.close - .15, to: { sel: "#approve" } },
    ],
    clicks: [{ t: T.open }, { t: T.close }],
    highlights: [
      { t0: T.total, t1: T.close + .1, sel: "#total" },
      { t0: T.close + .5, t1: S.duration - .1, sel: "#row" },          // gone by the last frame (clean cut)
    ],
    states: [
      fadeModal("#dialog", "#backdrop", T.open + .15, T.close + .15, { backdrop: .35 }),
      (t) => { const done = t >= T.close + .3; setText("#status", done ? "Approved" : "Pending"); $("#status").classList.toggle("ok", done); },
      captionTrack(S),                             // burned-in captions from S.words; gone after the voice (clean last frame)
    ],
  });
</script>
</body>
</html>
